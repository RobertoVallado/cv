basics:
  name: Roberto Vallado
  headline: Full-Stack Developer · Security Researcher · SEO Consultant
  headline-fr: Développeur Full-Stack · Chercheur en Sécurité · Consultant SEO
  email: contact@robertovallado.dev
  url: https://github.com/RobertoVallado
  linkedin: https://www.linkedin.com/in/roberto-vallado/
  location:
    address: Québec, QC, Canada

personal-statement: |
  Full-stack software developer with over five years of experience building reliable, secure
  applications in C# / .NET and Angular. I bring an active security perspective from bug bounty
  research on Bugcrowd — hunting real-world vulnerabilities in REST APIs — a mindset that
  directly shapes how I design systems, review code, and think about resilience every day.
  Beyond traditional development, I am actively exploring agentic AI: building LLM-powered
  automation workflows that help teams and individuals accomplish more with less friction.
  I also do freelance web development and SEO consulting for marketing professionals and
  businesses in Mexico, bridging technical depth with practical digital growth strategy.
  As a team lead and former instructor, I communicate clearly, mentor effectively, and deliver.
  Fluent in English, French, Portuguese and Spanish — I bring a genuinely international
  perspective and collaborate naturally across cultures and markets.

personal-statement-fr: |
  Développeur full-stack avec plus de cinq ans d'expérience dans la création d'applications
  fiables et sécurisées en C# / .NET et Angular. J'apporte une perspective active en sécurité
  grâce à mes recherches en bug bounty sur Bugcrowd — traque de vulnérabilités réelles dans des
  API REST — une approche qui façonne directement ma conception de systèmes et ma revue de code
  au quotidien. Au-delà du développement traditionnel, j'explore activement l'IA agentique :
  conception de flux de travail automatisés alimentés par des LLM qui aident les équipes à
  accomplir davantage avec moins de friction. Je fais également du développement web et du
  conseil SEO en freelance pour des professionnels du marketing au Mexique, alliant expertise
  technique et stratégie de croissance numérique concrète. Chef d'équipe et ancien instructeur,
  je communique clairement, mentor efficacement et livre des résultats. Maîtrise de l'anglais,
  du français, du portugais et de l'espagnol.

