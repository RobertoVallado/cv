work:
- name: Bugcrowd
  position: Freelance Security Researcher
  position-fr: Chercheur en Sécurité Indépendant
  startDate: 2023-07
  endDate: Present
  highlights:
  - Actively hunt for vulnerabilities across web applications and REST APIs using OWASP
    methodologies, manual testing and custom tooling.
  - Identified and responsibly disclosed multiple real-world security vulnerabilities,
    producing clear reproduction-ready reports that enabled rapid remediation.
  - Developed a security-first code review mindset that directly improves resilience and
    trust boundaries in day-to-day development work.
  highlights-fr:
  - Recherche active de vulnérabilités dans les applications web et les API REST en appliquant
    les méthodologies OWASP, les tests manuels et des outils personnalisés.
  - Identification et divulgation responsable de plusieurs vulnérabilités réelles, avec
    rédaction de rapports reproductibles permettant une remédiation rapide.
  - Développement d'une approche de revue de code axée sur la sécurité qui améliore directement
    la résilience des systèmes développés au quotidien.

- name: SSM Innovation Centre
  position: Intermediate Software Developer
  position-fr: Développeur logiciel intermédiaire
  startDate: 2023-06
  endDate: Present
  highlights:
  - Lead day-to-day technical direction for the development team — driving architectural
    decisions, code quality standards, and on-time delivery across active projects.
  - Mentor junior and intermediate developers through code reviews, pair programming and
    technical coaching, measurably improving team throughput and confidence.
  - Diagnose and resolve performance bottlenecks and defects across a C# / .NET codebase,
    consistently reducing time-to-resolution and improving system reliability.
  - Own project planning and milestone estimation in close collaboration with project managers,
    keeping stakeholders aligned and delivery predictable.
  - Champion long-term maintainability in every architectural decision — evaluating trade-offs
    between scalability, performance and team velocity.
  highlights-fr:
  - Pilotage de la direction technique quotidienne de l'équipe — décisions architecturales,
    standards de qualité du code et livraisons dans les délais sur les projets actifs.
  - Mentorat des développeurs juniors et intermédiaires via des revues de code, du pair
    programming et du coaching technique, améliorant sensiblement la productivité de l'équipe.
  - Diagnostic et résolution de problèmes de performance dans une base de code C# / .NET,
    réduisant les délais de résolution et améliorant la fiabilité du système.
  - Planification de projets et estimation des jalons en collaboration avec les gestionnaires,
    assurant l'alignement des parties prenantes et la prévisibilité des livraisons.
  - Défense de la maintenabilité à long terme dans chaque décision architecturale — évaluation
    des compromis entre évolutivité, performance et vélocité d'équipe.

- name: Freelance
  position: Web Developer & SEO Consultant
  position-fr: Développeur Web & Consultant SEO
  startDate: 2023-01
  endDate: Present
  highlights:
  - Design, build and optimize websites for marketing professionals and small businesses
    in Mexico and Latin America, focusing on performance, UX and conversion.
  - Apply SEO best practices including on-page optimization, structured data (Schema.org),
    Core Web Vitals tuning and keyword strategy to measurably grow organic traffic.
  - Integrate agentic AI and automation workflows (content pipelines, lead capture,
    analytics dashboards) to amplify marketing outcomes with minimal overhead.
  - Advise clients on Google Analytics 4 and Search Console setup, building data-driven
    marketing habits and tracking what actually moves the needle.
  highlights-fr:
  - Conception, développement et optimisation de sites web pour des professionnels du marketing
    et des PME au Mexique et en Amérique latine, avec focus sur la performance et la conversion.
  - Application des meilleures pratiques SEO — optimisation on-page, données structurées
    (Schema.org), Core Web Vitals et stratégie de mots-clés — pour augmenter le trafic organique.
  - Intégration de l'IA agentique et de flux automatisés (pipelines de contenu, capture de leads,
    tableaux de bord analytiques) pour amplifier les résultats marketing.
  - Accompagnement des clients dans la configuration de Google Analytics 4 et Search Console,
    les aidant à adopter des habitudes marketing basées sur les données.

