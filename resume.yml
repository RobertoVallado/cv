achievements:
  - text: Designed and implemented an SBOM pipeline at SSM Innovation Centre to
      proactively identify and remediate vulnerable third-party libraries, embedding
      supply-chain security into the team's delivery process before it became
      an industry mandate.
    text-fr: Conception et mise en œuvre d'un pipeline SBOM au SSM Innovation Centre
      pour identifier et corriger proactivement les bibliothèques tierces vulnérables,
      intégrant la sécurité de la chaîne d'approvisionnement dans le processus de
      livraison de l'équipe.
  - text: Active bug bounty researcher on Bugcrowd, finding and reporting real-world
      security vulnerabilities in REST APIs and web apps.
    text-fr: Chercheur en sécurité actif sur Bugcrowd, identification et divulgation
      responsable de vulnérabilités réelles dans des API REST et des applications web.
    source: 'https://bugcrowd.com'
  - text: Completed a Secure Application Development AEC at Cégep Limoilou in April 2026,
      building formal cybersecurity foundations alongside active bug bounty research.
    text-fr: AEC en développement d'applications sécuritaires complétée au Cégep Limoilou
      en avril 2026, en parallèle de recherches actives en bug bounty.
  - text: Returned to teach at Sault College just a year after graduating from the same
      program, designing and delivering Web Applications and Business Applications courses.
    text-fr: Revenu enseigner au Collège Sault un an seulement après y avoir obtenu son
      diplôme, en concevant et dispensant des cours de développement d'applications.
  - text: Graduated with a 3.8 GPA from Sault College Computer Programming Diploma.
    text-fr: Diplômé avec une moyenne de 3,8 du programme en programmation informatique du Collège Sault.
  - text: Fluent in English, French, Portuguese and Spanish, able to work across Canada,
      the US and Latin America without a language barrier.
    text-fr: Maîtrise de l'anglais, du français, du portugais et de l'espagnol, avec une
      capacité à travailler au Canada, aux États-Unis et en Amérique latine sans barrière linguistique.

