basics:
  name: Roberto Vallado
  headline: Full-Stack Developer · Security Researcher · SEO Consultant
  headline-fr: Développeur Full-Stack · Chercheur en Sécurité · Consultant SEO
  email: contact@robertovallado.dev
  url: https://github.com/RobertoVallado
  linkedin: https://www.linkedin.com/in/roberto-vallado/
  location:
    address: Québec, QC, Canada

personal-statement: |
  Full-stack developer with over five years of hands-on experience in C# / .NET and
  Angular, most recently as technical lead on a software development team. Drove
  architecture decisions, code quality standards and on-time delivery across multiple
  active projects while mentoring a team of four. Security is woven into how I work:
  active bug bounty research on Bugcrowd shapes how I design systems and review code
  every day. Former instructor, clear communicator, strong mentor. Fluent in English,
  French, Portuguese and Spanish.

personal-statement-fr: |
  Développeur full-stack avec plus de cinq ans d'expérience en C# / .NET et Angular,
  récemment en tant que lead technique au sein d'une équipe de développement. Pilotage
  des décisions d'architecture, des standards de qualité du code et des livraisons dans
  les délais sur plusieurs projets actifs, tout en encadrant une équipe de quatre
  développeurs. La sécurité fait partie de ma façon de travailler: mes recherches en
  bug bounty sur Bugcrowd façonnent ma conception de systèmes et mes revues de code au
  quotidien. Ancien instructeur, communicateur clair, mentor accompli. Maîtrise de
  l'anglais, du français, du portugais et de l'espagnol.

