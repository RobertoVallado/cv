  - Jumped into code reviews and QA processes from day one.
  - Wrote clean, maintainable code that rarely needed changes after review.
  highlights-fr:
  - Développement de fonctionnalités prêtes pour la production en C# et
    Angular dès le début du stage.
  - Participation aux revues de code et aux processus d'AQ dès le premier jour.
  - Code propre et maintenable qui nécessitait rarement des modifications
