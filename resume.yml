work:
- name: Bugcrowd
  position: Freelance Security Researcher
  position-fr: Chercheur en Sécurité Indépendant
  startDate: 2023-07
  endDate: Present
  highlights:
  - Hunt for vulnerabilities in web apps and REST APIs using OWASP methods,
    manual testing and custom tooling.
  - Found and reported several real-world security vulnerabilities with clear,
    reproducible write-ups that helped teams fix them quickly.
  - Thinking about security every day has made me a sharper developer and
    code reviewer.
  highlights-fr:
  - Recherche de vulnérabilités dans les applications web et les API REST via
    les méthodes OWASP, les tests manuels et des outils personnalisés.
  - Trouvé et rapporté plusieurs vulnérabilités réelles avec des write-ups
    clairs et reproductibles pour aider les équipes à les corriger rapidement.
  - Penser à la sécurité au quotidien a fait de moi un développeur et un
    relecteur de code plus rigoureux.

- name: Freelance
  position: Web Developer & SEO Consultant
  position-fr: Développeur Web & Consultant SEO
  startDate: 2023-01
  endDate: Present
  highlights:
  - Worked with 1 marketing clients across Mexico and Latin America, building
    and optimizing their websites for performance and conversion.
  - Handle SEO including on-page optimization, structured data, Core Web Vitals
    and keyword strategy.
  - Set up AI-powered automations like content pipelines, lead capture and
    analytics dashboards to help clients do more.
  - Help clients set up Google Analytics 4 and Search Console so they can see
    what's actually working.
  highlights-fr:
  - Accompagnement de 1 clients marketing au Mexique et en Amérique latine,
    conception et optimisation de leurs sites pour la performance et la conversion.
  - Gestion du SEO, incluant l'optimisation on-page, les données structurées, Core Web Vitals
    et la stratégie de mots-clés.
  - Mise en place d'automations alimentées par l'IA comme des pipelines de
    contenu, la capture de leads et des tableaux de bord analytiques.
  - Aide les clients à configurer Google Analytics 4 et Search Console pour
    savoir ce qui fonctionne vraiment.

- name: SSM Innovation Centre
  position: Intermediate Software Developer
  position-fr: Développeur logiciel intermédiaire
  startDate: 2023-06
  endDate: 2026-06
  highlights:
  - Led technical direction for the development team, owning architecture decisions,
    code quality standards and delivery across multiple active projects.
  - Mentored a team of 4 developers, including a summer student, through code reviews,
    pair programming and one-on-ones.
  - Reduced xUnit integration test run times by 20% in CI/CD pipelines, shortening
    feedback loops and improving throughput for the whole team.
  - Built and owned an SBOM pipeline to continuously audit all third-party library
    dependencies, surfacing vulnerable packages before they reached production and
    reducing supply-chain risk across our projects.
  - Filled QA and DevOps gaps in a lean team with no dedicated specialists, taking
    ownership of test strategy, CI/CD configuration and deployment pipelines alongside
    regular feature delivery, gaining hands-on breadth across the full stack.
  highlights-fr:
  - Pilotage de la direction technique de l'équipe, avec responsabilité sur les
    décisions d'architecture, les standards de qualité et les livraisons sur plusieurs
    projets actifs.
  - Encadrement d'une équipe de 4 développeurs, dont un étudiant en stage d'été,
    via des revues de code, du pair programming et des rencontres individuelles.
  - Réduction de 20% du temps d'exécution des tests d'intégration xUnit dans les
    pipelines CI/CD, améliorant la cadence et le feedback de toute l'équipe.
  - Mise en place et gestion d'un pipeline SBOM pour auditer en continu toutes les
    dépendances tierces, identifiant les paquets vulnérables avant leur mise en
    production et réduisant les risques liés à la chaîne d'approvisionnement.
  - Prise en charge des rôles QA et DevOps dans une équipe légère sans spécialistes
    dédiés, avec responsabilité de la stratégie de tests, de la configuration CI/CD
    et des déploiements en parallèle du développement de fonctionnalités.

- name: Sault College
