  highlights-fr:
  - Prise en main rapide d'une base de code C# / .NET complexe, avec des
    contributions aux fonctionnalités et corrections dès les premières semaines.
  - Résolution autonome de problèmes techniques complexes grâce à une bonne
    maîtrise des algorithmes, structures de données et débogage.
  - Bonne collaboration en équipe Agile, avec participation aux sprints,
    standups et rétrospectives en maintenant une haute qualité de code.

- name: Sault College
