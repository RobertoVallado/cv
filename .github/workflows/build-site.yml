name: 🪁 Make Site

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'web/**'
      - 'resume.yml'
      - '.github/workflows/build-site.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'web/**'
      - 'resume.yml'
  workflow_dispatch:

# Allow one concurrent deployment
concurrency:
  group: build-site
  cancel-in-progress: true

jobs:
  build-cv:
    name: Build CV PDF
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'lib/requirements.txt'
      - name: Cache LaTeX packages
        uses: actions/cache@v4
        with:
          path: |
            /usr/share/texlive
            /usr/share/texmf
            /var/lib/texmf
          key: latex-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            latex-${{ runner.os }}-
      
      - name: Install LaTeX (optimized)
        run: |
          # Update package list only if cache miss
          if [ ! -f "/usr/bin/xelatex" ]; then
            echo "🔄 Installing LaTeX packages..."
            # Use faster mirror and minimal packages
            sudo apt-get update -qq -o Acquire::Languages=none
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              texlive-xetex \
              texlive-fonts-recommended \
              texlive-latex-extra \
              fonts-font-awesome \
              && sudo apt-get clean \
              && sudo rm -rf /var/lib/apt/lists/*
          else
            echo "✅ LaTeX already cached and available"
          fi
      - name: Install Python dependencies
        run: |
          pip install -r lib/requirements.txt
      
      - name: Generate PDFs (EN + FR)
        run: |
          mkdir -p out

          echo "🔄 Generating English PDF..."
          python lib/generate.py --resume resume.yml --template template.jinja --output tex/resume.tex --lang en
          python lib/compile.py --input tex/resume.tex --output out/Roberto-Vallado-CV-EN.pdf
          echo "✅ English PDF generated"

          echo "🔄 Generating French PDF..."
          python lib/generate.py --resume resume.yml --template template.jinja --output tex/resume.tex --lang fr
          python lib/compile.py --input tex/resume.tex --output out/Roberto-Vallado-CV-FR.pdf
          echo "✅ French PDF generated"
          ls -la out/

      - name: Upload CV PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdfs
          path: |
            out/Roberto-Vallado-CV-EN.pdf
            out/Roberto-Vallado-CV-FR.pdf
          retention-days: 90

  build-website:
    name: Build Website
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'
      
      - name: Install web dependencies
        run: |
          cd web
          npm ci
      
      - name: Build website
        env:
          GITHUB_PAGES: true
        run: |
          cd web
          npm run build
      
      - name: Verify build output
        run: |
          cd web
          if [ -f "build/index.html" ]; then
            echo "✅ Static site built successfully"
            echo "Build directory contains:"
            ls -la build/ | head -15
            echo ""
            echo "Build size:"
            du -sh build/
          else
            echo "❌ Build failed - no index.html found in build directory"
            exit 1
          fi
      
      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: web/build/
          retention-days: 90

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build-cv, build-website]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.event_name != 'pull_request' && needs.build-website.result == 'success'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download CV PDF artifacts
        if: needs.build-cv.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: cv-pdfs
          path: ./pdf/

      - name: Download website artifact
        uses: actions/download-artifact@v4
        with:
          name: website-build
          path: ./website/

      - name: Copy PDFs to website build
        run: |
          if [ "${{ needs.build-cv.result }}" = "success" ] && [ -f "pdf/Roberto-Vallado-CV-EN.pdf" ]; then
            cp "pdf/Roberto-Vallado-CV-EN.pdf" "website/roberto-vallado-cv-en.pdf"
            cp "pdf/Roberto-Vallado-CV-FR.pdf" "website/roberto-vallado-cv-fr.pdf"
            echo "✅ Both PDFs copied to website build"
          else
            echo "⚠️  CV build failed or PDFs not found, deploying website without PDFs"
          fi

      - name: Add CNAME for custom domain
        run: echo "cv.robertovallado.dev" > website/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./website/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  comment-pr:
    name: Comment on PR
    runs-on: ubuntu-latest
    needs: [build-cv, build-website]
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const cvStatus = '${{ needs.build-cv.result }}';
            const websiteStatus = '${{ needs.build-website.result }}';
            
            let message = '🪁 Build completed!\n\n';
            message += `- CV PDF: ${cvStatus === 'success' ? '✅ Generated successfully' : '❌ Failed to generate'}\n`;
            message += `- Website: ${websiteStatus === 'success' ? '✅ Built successfully' : '❌ Failed to build'}\n\n`;
            
            if (cvStatus === 'success' && websiteStatus === 'success') {
              message += 'Both CV and website will be deployed when this PR is merged.';
            } else {
              message += 'Please check the failed jobs before merging.';
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            })
